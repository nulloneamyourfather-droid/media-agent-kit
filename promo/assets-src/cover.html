<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { width:1080px; height:1440px; background:#FFF6EC; font-family:"Microsoft YaHei","PingFang SC",sans-serif; position:relative; overflow:hidden; }
  .tag { position:absolute; top:70px; left:80px; background:#2B2B2B; color:#FFF6EC; font-size:34px; font-weight:700; padding:14px 34px; border-radius:40px; letter-spacing:4px; }
  .dot1 { position:absolute; top:200px; right:100px; width:120px; height:120px; border-radius:50%; background:#FFD9C7; }
  .dot2 { position:absolute; bottom:340px; left:60px; width:80px; height:80px; border-radius:50%; background:#FFE8B3; }
  h1 { position:absolute; top:280px; left:80px; width:920px; font-size:104px; line-height:1.42; color:#2B2B2B; font-weight:900; }
  .hl { color:#FF5E3A; }
  .box { position:absolute; top:840px; left:80px; width:920px; background:#fff; border-radius:36px; padding:44px 50px; box-shadow:0 10px 40px rgba(43,43,43,.08); }
  .row { display:flex; align-items:flex-start; margin-bottom:30px; }
  .row:last-child { margin-bottom:0; }
  .badge { flex-shrink:0; width:150px; font-size:30px; font-weight:800; color:#fff; background:#FF5E3A; border-radius:14px; padding:10px 0; text-align:center; margin-right:28px; }
  .row:nth-child(2) .badge { background:#F5A623; }
  .row:nth-child(3) .badge { background:#8BC34A; }
  .txt { font-size:36px; color:#4A4A4A; line-height:1.5; font-weight:600; }
  .txt b { color:#2B2B2B; }
  .foot { position:absolute; bottom:80px; left:0; width:100%; text-align:center; font-size:34px; color:#9A8F84; font-weight:600; letter-spacing:6px; }
</style>
</head>
<body>
  <div class="tag">自媒体工具包</div>
  <div class="dot1"></div>
  <div class="dot2"></div>
  <h1>发笔记前<br>先让 AI 查一遍<br><span class="hl">「违禁词」</span></h1>
  <div class="box">
    <div class="row"><div class="badge">法律红线</div><div class="txt">广告法极限词，<b>一票否决</b></div></div>
    <div class="row"><div class="badge">平台违禁</div><div class="txt">引流暗语、外链话术，<b>必须改</b></div></div>
    <div class="row"><div class="badge">限流风险</div><div class="txt">低质信号词，<b>提前预警</b></div></div>
  </div>
  <div class="foot">合规自查 · 标题工坊 · 开源免费</div>
</body>
</html>
